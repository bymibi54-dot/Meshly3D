name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: Meshly3D

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unit tests (GLB loader + Mesh, host C++ with sanitizers)
        run: |
          g++ -std=c++17 -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=undefined -Wall -Wextra \
            -Iapp/src/main/cpp tests/loader_test.cpp app/src/main/cpp/mesh.cpp app/src/main/cpp/glb_loader.cpp \
            -o loader_test
          ./loader_test samples

      - name: Install Android SDK parts (platform, build-tools, NDK, CMake)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Check the native library is inside the APK
        run: unzip -l app/build/outputs/apk/debug/*.apk | grep libmeshly_native.so

      - uses: actions/upload-artifact@v4
        with:
          name: Meshly3D-debug-apk
          path: Meshly3D/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
